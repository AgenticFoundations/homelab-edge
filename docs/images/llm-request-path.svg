<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img">
<title>A public endpoint. A model running at home.</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/></marker></defs>
<rect width="1400" height="760" fill="#0f172a"/>
<text x="60" y="80" fill="#f8fafc" font-family="Arial,sans-serif" font-size="36" font-weight="bold">A public endpoint. A model running at home.</text>
<text x="60" y="120" fill="#94a3b8" font-family="Arial,sans-serif" font-size="21">Request path · native inference on the Mac Studio</text>
<rect x="60" y="180" width="330" height="105" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="82" y="222" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="bold">Remote client</text>
<text x="82" y="256" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">API key + HTTPS</text>
<rect x="510" y="180" width="330" height="105" rx="18" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
<text x="532" y="222" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="bold">Cloudflare</text>
<text x="532" y="256" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">llm.example.com</text>
<rect x="960" y="180" width="350" height="105" rx="18" fill="#1e293b" stroke="#fb923c" stroke-width="2"/>
<text x="982" y="222" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="bold">cloudflared</text>
<text x="982" y="256" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Outbound tunnel connector</text>
<rect x="960" y="400" width="350" height="105" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="982" y="442" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="bold">Nginx ingress</text>
<text x="982" y="476" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">llm-edge:8080</text>
<rect x="510" y="400" width="330" height="105" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="532" y="442" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="bold">LiteLLM gateway</text>
<text x="532" y="476" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Authentication + model alias</text>
<rect x="60" y="400" width="330" height="105" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
<text x="82" y="442" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="bold">Native Ollama</text>
<text x="82" y="476" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Apple Silicon inference</text>
<path d="M390,232 L510,232" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M840,232 L960,232" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1135,285 L1135,400" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M960,452 L840,452" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M510,452 L390,452" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="60" y="610" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">The connector, ingress, and gateway run in OrbStack containers.</text>
<text x="60" y="650" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">Ollama runs natively on macOS. Postgres supports the gateway (omitted from this request path).</text>
<text x="60" y="690" fill="#94a3b8" font-family="Arial,sans-serif" font-size="20">Cloudflare carries remote requests; local inference does not mean an entirely local data path.</text>
</svg>